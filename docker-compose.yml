
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: infrawatch-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - node-exporter
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: infrawatch-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
